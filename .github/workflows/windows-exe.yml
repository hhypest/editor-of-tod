name: Windows exe

# Собирает переносной editor-of-tod.exe и проверяет его браузерными тестами.
# Запускается только вручную (Actions → Windows exe → Run workflow): по правилам
# репозитория приложение не публикуется автоматически. Файл сохраняется как
# артефакт этого запуска.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:exe
      - run: npx playwright install chromium
      - run: npm run test:e2e
        env:
          TOD_E2E_EXE: ${{ github.workspace }}\release\editor-of-tod.exe
      - uses: actions/upload-artifact@v7
        with:
          name: editor-of-tod-win-x64
          path: release/editor-of-tod.exe
          retention-days: 14
          if-no-files-found: error
